# Previous token-efficient Floor-C profile. Keep this for A/B measurement; do not promote it
# again until an out-of-distribution suite shows that every enabled gate category is safe.
token_budget: 0
mandatory_remote: 1
gate_enabled: true
gate_profile: legacy
local_slots: 4
remote_slots: 8
wall_seconds: 510
snapshot_interval_seconds: 5
model_paths:
  main: ""
  draft: ""
llama:
  base_url: "http://127.0.0.1:8080/v1"
  model: "local"
  system_prompt: ""
local_candidate:
  enabled: false
  categories:
    actual_qa: false
    math_reasoning: false
    sentiment_analysis: false
    summarization: false
    named_entity_recognition: false
    code_debugging: false
    logic_puzzles: false
    code_generation: false
batching:
  enabled: true
  code_enabled: false
  max_batch_size: 10
remote:
  timeout_seconds: 25
  retries: 2
  temperature: 0
  accuracy_first: false
  reasoning_effort: none
  usd_per_mtok: 0.9
  dev_spend_cap: 0.0
max_tokens:
  actual_qa: 40
  math_reasoning: 10
  sentiment_analysis: 80
  summarization: 220
  named_entity_recognition: 60
  code_debugging: 300
  logic_puzzles: 40
  code_generation: 300
