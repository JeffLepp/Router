# Candidate Floor-CL profile: summary-only local transformation on the 2 vCPU / 4GB
# CPU-only grader. Use only after the baked GGUF passes the precision/latency bakeoff;
# config.yaml remains the safe Floor-C default.
token_budget: 0
mandatory_remote: 1
local_slots: 4
remote_slots: 8
wall_seconds: 510
snapshot_interval_seconds: 5
model_paths:
  main: ""
  draft: ""
llama:
  base_url: "http://127.0.0.1:8080/v1"
  model: "local"
  system_prompt: ""
local_candidate:
  enabled: true
  self_consistency_k: 1
  temp: 0
  max_tokens: 64
  latency_cap_s: 35
  summary_queue_size: 1
  summary_retries: 1
  summary_task_timeout_s: 35
  summary_stage_timeout_s: 240
  summary_max_tokens:
    one_sentence: 64
    three_sentences: 110
    structured_report: 150
    default: 150
  categories:
    actual_qa: false
    math_reasoning: false
    sentiment_analysis: false
    summarization: true
    named_entity_recognition: false
    code_debugging: false
    logic_puzzles: false
    code_generation: false
batching:
  enabled: true
  code_enabled: false
  max_batch_size: 10
remote:
  timeout_seconds: 25
  retries: 2
  temperature: 0
  usd_per_mtok: 0.9
  dev_spend_cap: 0.0
max_tokens:
  actual_qa: 40
  math_reasoning: 10
  sentiment_analysis: 80
  summarization: 220
  named_entity_recognition: 60
  code_debugging: 300
  logic_puzzles: 60
  code_generation: 300
