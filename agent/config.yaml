token_budget: 0
mandatory_remote: 1
local_slots: 4
remote_slots: 8
wall_seconds: 510
snapshot_interval_seconds: 5
model_paths:
  main: ""
  draft: ""
llama:
  base_url: "http://127.0.0.1:8080/v1"
  model: "local"
# enabled: one-line flip to Floor-CL. Left off for grading: on the confirmed
# 2 vCPU / 4GB CPU-only grader the 3B can't clear latency_cap_s, so the tier
# defers everything anyway (verified in-container; see PR #6).
local_candidate:
  enabled: false
  self_consistency_k: 2
  temp: 0
  max_tokens: 64
  latency_cap_s: 4
  categories:
    actual_qa: true
    math_reasoning: true
    sentiment_analysis: true
    summarization: false
    named_entity_recognition: true
    code_debugging: true
    logic_puzzles: true
    code_generation: false
batching:
  enabled: false
  max_batch_size: 10
remote:
  timeout_seconds: 25
  retries: 2
  temperature: 0
  usd_per_mtok: 0.9
  dev_spend_cap: 0.0
max_tokens:
  actual_qa: 40
  math_reasoning: 10
  sentiment_analysis: 80
  summarization: 80
  named_entity_recognition: 60
  code_debugging: 300
  logic_puzzles: 40
  code_generation: 300
