token_budget: 0
mandatory_remote: 1
# Hidden-set recovery profile: keep only operations that are recomputed from an explicit
# numeric expression. All dataset-shaped and language-heuristic solvers remain remote.
gate_enabled: true
# math_full: full arithmetic/wordmath template chain for math only (0 wrong on all
# labeled dev tasks, scripts/math_audit); every other category still defers remotely.
gate_profile: math_full
local_slots: 4
remote_slots: 8
wall_seconds: 510
snapshot_interval_seconds: 5
model_paths:
  main: ""
  draft: ""
llama:
  base_url: "http://127.0.0.1:8080/v1"
  model: "local"
  system_prompt: ""
local_candidate:
  enabled: false
  self_consistency_k: 2
  temp: 0
  max_tokens: 64
  latency_cap_s: 35
  summary_queue_size: 1
  summary_retries: 1
  summary_task_timeout_s: 35
  summary_stage_timeout_s: 240
  summary_max_tokens:
    one_sentence: 64
    three_sentences: 110
    structured_report: 150
    default: 150
  categories:
    actual_qa: false
    math_reasoning: false
    sentiment_analysis: false
    summarization: false
    named_entity_recognition: false
    code_debugging: false
    logic_puzzles: false
    code_generation: false
batching:
  # Folds actual_qa/sentiment/ner into one request each, so minimax's ~119-token chat template
  # and the per-category contract are paid once instead of once per task. Lines that fail
  # validation are re-run individually, so a bad parse costs the un-batched price, not the task.
  enabled: true
  # Requires repeated paid A/B evidence (zero pass-to-fail and >=145 actual tokens saved).
  code_enabled: false
  max_batch_size: 10
remote:
  # Accuracy-first: the 19-task judge has ample wall-clock headroom, while code models can
  # spend 25-45s in hidden reasoning before emitting a complete answer.
  timeout_seconds: 90
  retries: 2
  temperature: 0
  # One direct-model batch classifies the real judge's approximately 19 tasks.
  classifier_enabled: true
  # Zero-token rule prefilter: labels only unambiguous shapes (0 wrong on all 280
  # labeled dev tasks), defers the rest into the remote batch below.
  classifier_prefilter_enabled: true
  classifier_batch_size: 20
  classifier_max_tokens: 1024
  classifier_confidence: 0.99
  classifier_model_category: summarization
  accuracy_first: true
  reasoning_effort: high
  # Phase 1: direct-output work does not need hidden chain-of-thought. Adaptive
  # categories retain high effort for coupled constraints, sarcasm, and exclusions.
  # Phase 2 aggressive: direct output for every extraction/label/compression category —
  # hidden reasoning is spent only where deduction IS the task (logic, code). Accepted
  # risks at the 80% floor: sarcasm, structured summaries, ambiguous entities.
  reasoning_effort_by_category:
    actual_qa: none
    named_entity_recognition: none
    sentiment_analysis: none
    summarization: none
    math_reasoning: none
  usd_per_mtok: 0.9
  dev_spend_cap: 0.0
max_tokens:
  actual_qa: 1024
  math_reasoning: 512
  sentiment_analysis: 1024
  # Structured summaries can use most of a 2K completion budget in hidden reasoning and then
  # truncate an action item; 4K completed the same workload within the runtime envelope.
  summarization: 4096
  named_entity_recognition: 4096
  code_debugging: 4096
  logic_puzzles: 1024
  code_generation: 4096
